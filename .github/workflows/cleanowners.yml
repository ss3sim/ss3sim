---
  name: Weekly codeowners cleanup
  on:
    workflow_dispatch:
    schedule:
      - cron: '3 2 1 * *'
  
  permissions:
    contents: read
  
  jobs:
    cleanowners:
      name: cleanowners
      runs-on: ubuntu-latest
      permissions:
        issues: write
  
      steps:
        - name: Run cleanowners action
          uses: github-community-projects/cleanowners@v2
          env:
            GH_TOKEN: ${{ secrets.GH_TOKEN }}
            REPOSITORY: ss3sim/ss3sim
